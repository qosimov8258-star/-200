# konkurs-web nginx (deploy/compose.yml → /etc/nginx/conf.d/default.conf).
# Oldida Mezon nginx'i turadi (80/443, TLS) va konkurs-olivia.uz ni shu konteynerga uzatadi.
#
#   /          Mini App / sayt (Vite, SPA)
#   /admin/    admin panel (Next.js statik eksport)
#   /api/      backend:3000 (NestJS)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    # Redirect'lar (/admin → /admin/, papka → papka/) nisbiy bo'lsin: tashqarida https,
    # bu konteyner esa http'da ishlaydi.
    absolute_redirect off;

    # Istoriya yuklash: video so'rov tanasining o'zida (raw), backend 50 MB gacha qabul qiladi.
    # Faqat shu manzilga katta chegara; tana backend'ga to'g'ridan-to'g'ri oqim bilan uzatiladi.
    location = /api/v1/miniapp/stories {
        client_max_body_size 55m;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Qoida videosi (admin panel → Sozlamalar → Tanlov qoidalari): 100 MB gacha, raw tana.
    location = /api/v1/admin/rules/video {
        client_max_body_size 105m;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI worker'ning ichki API'si faqat Docker tarmog'i ichida (ai-worker → backend:3000).
    location /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        # Docker DNS — backend qayta ishga tushsa ham yangi IP topiladi.
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Admin "Reklama kutubxonasini hoziroq tekshirish" javobi 1–3 daqiqa kutadi.
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Admin panel ---

    location = /admin {
        return 301 /admin/;
    }

    # Nomida xesh bor — abadiy keshlanadi.
    location /admin/_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /admin/ {
        try_files $uri $uri/ $uri.html /admin/404.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # --- Mini App / sayt (SPA) ---

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
