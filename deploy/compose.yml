# Reels tanlov — serverdagi Docker Compose (konkurs-olivia.uz).
#
# Server: repo /srv/konkurs/app ga klonlangan, shu fayl — /srv/konkurs/app/deploy/compose.yml.
# Ishga tushirish (odatda /srv/konkurs/bin/deploy orqali):
#   docker compose -f /srv/konkurs/app/deploy/compose.yml up -d --build --remove-orphans
# Batafsil — deploy/README.md.
#
# Yo'llar shu faylga nisbatan (deploy/). Maxfiy sozlamalar repoda emas:
# /srv/konkurs/shared/backend.env (serverda, qo'lda boshqariladi).

# Loyiha nomi eski sozlama bilan bir xil — konteynerlar ikkilanmaydi, yangisi bilan almashadi.
name: konkurs

services:
  backend:
    build:
      context: ../apps/backend
      # Context'ga nisbatan; Dockerfile repoda deploy/ ichida.
      dockerfile: ../../deploy/Dockerfile.backend
      target: backend
    env_file: /srv/konkurs/shared/backend.env
    environment:
      # Backend ma'lumotlarni (ishtirokchilar, reellar, support, audit...) shu papkaga yozadi.
      DATA_DIR: /app/data
    volumes:
      # Host papkasi 1000:1000 (konteynerdagi `node` foydalanuvchisi) egaligida bo'lishi shart.
      - /srv/konkurs/data:/app/data
    # Tashqariga port ochilmaydi — faqat `web` (nginx) /api/ ni shu yerga uzatadi.
    restart: unless-stopped
    # To'xtatishda backend ma'lumotlarni diskka yozib ulgurishi uchun.
    stop_grace_period: 30s

  # AI video tekshiruvi (admin panel → AI). Backend bilan bir xil kod, ichida ffmpeg bor.
  # Kerak: backend.env da ANTHROPIC_API_KEY va AI_WORKER_TOKEN (backend bilan bir xil). Ular
  # bo'lmasa worker yiqilmaydi — log'ga sababini yozib kutadi. Batafsil — deploy/README.md.
  ai-worker:
    build:
      context: ../apps/backend
      dockerfile: ../../deploy/Dockerfile.backend
      target: worker
    env_file: /srv/konkurs/shared/backend.env
    environment:
      # Backend'ning ichki API'si — Docker tarmog'i ichida (nginx orqali emas).
      AI_BACKEND_URL: http://backend:3000/api/v1
      AI_WORK_DIR: /app/work
    volumes:
      # Kadrlar Claude natijasi kelguncha (24 soatgacha) saqlanadi — worker qayta ishga tushsa ham.
      - ai-work:/app/work
    depends_on:
      - backend
    restart: unless-stopped
    stop_grace_period: 60s

  web:
    build:
      # Repo ildizi: Mini App va admin panel bitta nginx image'iga yig'iladi (.dockerignore — ildizda).
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Nisbiy yo'l: Mini App API'ga o'zi ochilgan domen orqali murojaat qiladi (CORS kerak emas,
        # sessiya cookie'si shu domenda qoladi).
        VITE_API_URL: /api/v1
    volumes:
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      default:
      # Mezon nginx'i (80/443) konkurs-olivia.uz so'rovlarini shu nom bilan uzatadi.
      mezon:
        aliases:
          - konkurs-web

volumes:
  ai-work:

networks:
  mezon:
    external: true
    name: mezon_default
